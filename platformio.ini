; PlatformIO - Nodo BOMBA (peristaltica 12 V, encoder AS5600 + PWM)
;
; Placa real: ESP32 Dev Module (WROOM-32). Dosifica volumetricamente e informa el volumen real
; por `/api/events/pump`; el lazo corta por revoluciones con timeout anti-sobredosificacion.
;
;   pio run                        -> construye el entorno por defecto (esp32dev)
;   pio run -t upload              -> flashea por USB
;   pio run -e esp32dev-ota -t upload  -> flashea por WiFi (pump-doser.local)
;
; El OTA necesita dos ranuras de aplicacion: `default.csv` ya las trae.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; El bus de hardware se elige por entorno: real (LEDC/AS5600) o virtual (pump_sim).
build_src_filter = +<main.cpp> +<pump_bus_real.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = pump-doser.local
upload_flags =
    --port=3232
    --timeout=60

; ---------------------------------------------------------------
; VIRTUAL: sin bomba ni encoder fisicos (pruebas de UI y orquestacion).
; Usa el mismo backend real con la misma DEVICE_KEY.
; ---------------------------------------------------------------
[env:esp32dev-virtual]
extends = env:esp32dev
build_flags =
    -DPUMP_VIRTUAL=1
build_src_filter = +<main.cpp> +<pump_bus_virtual.cpp> +<pump_sim.cpp>

; Alias del mismo bus virtual apuntando a un ESP32-S3 (banco de pruebas).
[env:esp32-s3-virtual]
extends = env:esp32dev
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    -DPUMP_VIRTUAL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<main.cpp> +<pump_bus_virtual.cpp> +<pump_sim.cpp>
