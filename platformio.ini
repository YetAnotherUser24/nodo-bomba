; PlatformIO Project Configuration File

[platformio]
default_envs = esp32dev

; -------------------------------------------------------------
; Environment: ESP32 Dev Module
; -------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
